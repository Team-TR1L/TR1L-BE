# Job1 reliability 로컬 환경
# 다른 로컬 스택과 포트가 겹치지 않게 2xxxx, 1xxxx 대역을 쓴다
#   main DB 25432, target DB 25433, mongo 27027, grafana 13000, prometheus 19091
# 실행: docker compose -p tr1l-rel -f infra/reliability/docker-compose.reliability.yml up -d
name: tr1l-rel

services:
  pg-main:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    ports:
      - "25432:5432"
    volumes:
      - pg_main_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 3s
      timeout: 3s
      retries: 30

  pg-target:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_target
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports:
      - "25433:5432"
    volumes:
      - pg_target_data:/var/lib/postgresql/data
      - ../monitoring/postgres_target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_target"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8 # 이 환경에서 검증한 버전. 루트 docker-compose.yml은 mongo:7
    environment:
      TZ: Asia/Seoul
    ports:
      - "27027:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\""]
      interval: 3s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "19091:9090"
    volumes:
      - ./prometheus.reliability.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.4.0 # 이 환경에서 검증한 버전. 모니터링 compose는 11.1.0
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/job1-reliability.json
      POSTGRES_TARGET_HOST: pg-target
      PG_SUB_DB: billing_target
      PG_SUB_USER: postgres
      PG_SUB_PASSWORD: postgres
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - pg-target

volumes:
  pg_main_data:
  pg_target_data:
  mongo_data:
  grafana_data:
