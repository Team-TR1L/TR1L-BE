tasks.named("bootJar") {
    archiveFileName = "worker.jar"
}
dependencies {
    implementation project(':shared')
    implementation project(':contexts:billing')
    //spring-batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.batch:spring-batch-core'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.opentelemetry:opentelemetry-api:1.46.0'
    implementation 'io.opentelemetry:opentelemetry-context:1.46.0'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.awaitility:awaitility'

    //Mongo DB
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb:3.5.9")

    //PostgreSQL
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.7'


    //thymelaf
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"

    // s3 의존성 설치, 비동기 클라이언트 추가
    implementation platform("software.amazon.awssdk:bom:2.41.10")
    implementation "software.amazon.awssdk:s3"
    implementation "software.amazon.awssdk:auth"
    implementation "software.amazon.awssdk:aws-core"
    implementation "software.amazon.awssdk:sdk-core"
    implementation "software.amazon.awssdk:apache-client"
    implementation("software.amazon.awssdk:netty-nio-client")
    implementation("io.micrometer:micrometer-core")



    //Liquibase
    implementation "org.liquibase:liquibase-core:4.30.0"

    // SQL query counting (datasource proxy)
    implementation "net.ttddyy:datasource-proxy:1.10"

    testImplementation 'io.qameta.allure:allure-junit5:2.29.1'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
}

// 재실행 안전 장치를 하나씩 깨뜨린 mutant (TR1L-170)
// 원본 클래스를 복사해 한 곳만 바꾼 것이다. mutant 마다 jar 하나를 만들고, 하네스가 PropertiesLauncher 의
// loader.path 로 붙이면 같은 이름의 원본 클래스를 가린다. worker.jar 에는 들어가지 않는다
def reliabilityMutants = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6']
reliabilityMutants.each { id ->
    def sourceSet = sourceSets.create("mutant${id}") {
        java.srcDir "src/reliabilityMutant/${id}/java"
        resources.srcDir "src/reliabilityMutant/${id}/resources"
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    // 원본 클래스가 Lombok 을 써서 mutant 사본도 같은 annotation processor 가 필요하다
    configurations.named(sourceSet.compileOnlyConfigurationName) { extendsFrom configurations.compileOnly }
    configurations.named(sourceSet.annotationProcessorConfigurationName) { extendsFrom configurations.annotationProcessor }
    tasks.register("mutant${id}Jar", Jar) {
        archiveFileName = "mutant-${id}.jar"
        destinationDirectory = layout.buildDirectory.dir('reliability-mutants')
        from sourceSet.output
    }
}
tasks.register('reliabilityMutantJars') {
    group = 'verification'
    description = 'Job1 재실행 안전 장치 mutant jar 를 만든다'
    dependsOn reliabilityMutants.collect { "mutant${it}Jar" }
}

tasks.named('test') {
    // D5(108만 명) 검증은 사용자 전원의 분포, snapshot 해시, 금액을 메모리에 올려 비교한다. 기본 512MB 로는 모자란다
    maxHeapSize = '4g'
}
