id: S-010R
name: rerun-after-fault-matrix-cell
description: 장애 행렬 한 칸의 장애 뒤 같은 cutoff 로 다시 실행해 S-001 run 직후 상태와 내용까지 같은지 검증한다

datasetId: D1-rerun-mvp

job:
  name: calculateJob
  cutoff: "2026-02-01T00:00:00Z"
  billingMonthDay: "2026-01-01"

fault:
  enabled: false

rerun:
  enabled: true
  sameCutoff: true

validate:
  phase: after_rerun_complete
  invariants:
    - INV-001
    - INV-002
    - INV-003
    - INV-004

compareWithBaseline:
  enabled: true
  baselineScenarioId: S-001
  metrics:
    - billingTargetsCount
    - billingWorkCount
    - calculatedCount
    - mongoSnapshotCount
    - duplicateMongoSnapshotCount
    - targetWithSnapshotCount

allure:
  epic: "TR1L Job1 Reliability"
  feature: "Fault Matrix"
  story: "S-010R rerun after fault matrix cell"
